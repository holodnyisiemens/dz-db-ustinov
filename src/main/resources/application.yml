spring:
  application:
    name: kennel
  datasource:
    url: jdbc:postgresql://localhost:5432/kennel
    username: kennel
    password: kennel
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # схему создаёт Flyway, Hibernate только проверяет
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
